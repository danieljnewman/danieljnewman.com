<!DOCTYPE html>
<html lang="en">

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
  <title>Contact | Daniel J Newman</title>
  <link rel="canonical" href="https://danieljnewman.com/contact.html">
<link rel="stylesheet" href="/style.css">
</head>
  
<body>
  
  <div id="site-header"></div>
  
  <main class="contact-page">
    
    <h2>CONTACT</h2>

    <section class="contact-section">

      <form id="contact-form" name="contact" method="POST" data-netlify="true" data-netlify-recaptcha="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">

        <div class="contact-hidden">
          <label>
            Don't fill this out:
          <input name="bot-field">
          </label>
        </div>
    
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject">
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <div class="form-end">
        
          <div data-netlify-recaptcha="true"></div>

          <h6>By submitting this form, <br> you agree to the <a href="/privacy-policy.html">Privacy Policy</a>.</h6>
        
          <button type="submit">Send</button>

        </div>
        
      </form>

    </section>
  
  </main>
  
  <div id="site-footer"></div>

  <script src="/script.js"></script>
  
</body>
</html>
